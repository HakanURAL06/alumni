<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="iuGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="iuBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D8CF8"/>
      <stop offset="100%" stop-color="#0F56B3"/>
    </linearGradient>
    <radialGradient id="iuSunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <!-- Text Path for Circular Arc -->
    <path id="upperArc" d="M 28 100 A 72 72 0 1 1 172 100" fill="none"/>
  </defs>

  <!-- Outer Ring with Subtle Drop Shadow -->
  <circle cx="100" cy="100" r="96" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#iuGoldGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="#0F172A"/>

  <!-- Gold Ring Decorative Inner Border -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Circular Text: İSTANBUL ÜNİVERSİTESİ -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#F8FAFC" letter-spacing="2.2">
    <textPath href="#upperArc" startOffset="50%" text-anchor="middle">
      İSTANBUL ÜNİVERSİTESİ
    </textPath>
  </text>

  <!-- 1453 Foundation Year & Decorative Stars -->
  <g fill="#F59E0B">
    <polygon points="62,154 64,159 69,159 65,162 67,167 62,164 57,167 59,162 55,159 60,159" transform="scale(0.8) translate(15, 20)"/>
    <text x="100" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="900" fill="#F59E0B" text-anchor="middle" letter-spacing="3">1453</text>
    <polygon points="138,154 140,159 145,159 141,162 143,167 138,164 133,167 135,162 131,159 136,159" transform="scale(0.8) translate(35, 20)"/>
  </g>

  <!-- Inner Medallion Background -->
  <circle cx="100" cy="95" r="44" fill="#1E293B" stroke="url(#iuGoldGrad)" stroke-width="2"/>

  <!-- Centerpiece: Istanbul University Emblem & Beyazıt Gate Sun Rays -->
  <!-- Radiating Sun Rays (16 rays) -->
  <g stroke="url(#iuGoldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <line x1="100" y1="59" x2="100" y2="65" />
    <line x1="100" y1="131" x2="100" y2="125" />
    <line x1="64" y1="95" x2="70" y2="95" />
    <line x1="136" y1="95" x2="130" y2="95" />
    <line x1="75" y1="70" x2="79" y2="74" />
    <line x1="125" y1="120" x2="121" y2="116" />
    <line x1="75" y1="120" x2="79" y2="116" />
    <line x1="125" y1="70" x2="121" y2="74" />
    <line x1="86" y1="62" x2="88" y2="67" />
    <line x1="114" y1="128" x2="112" y2="123" />
    <line x1="67" y1="81" x2="72" y2="83" />
    <line x1="133" y1="109" x2="128" y2="107" />
    <line x1="67" y1="109" x2="72" y2="107" />
    <line x1="133" y1="81" x2="128" y2="83" />
    <line x1="86" y1="128" x2="88" y2="123" />
    <line x1="114" y1="62" x2="112" y2="67" />
  </g>

  <!-- Central Symbol: Historic Beyazıt Portal Gate Silhouetted in Gold -->
  <g fill="url(#iuSunGrad)">
    <!-- Central Portal Arch -->
    <path d="M 85 116 L 85 92 Q 85 79 100 79 Q 115 79 115 92 L 115 116 L 110 116 L 110 93 Q 110 84 100 84 Q 90 84 90 93 L 90 116 Z" />
    <!-- Pediment Arch Crest -->
    <path d="M 82 78 Q 100 71 118 78 L 115 81 Q 100 75 85 81 Z" />
    <!-- Portal Columns & Capitals -->
    <rect x="80" y="85" width="4" height="31" rx="1"/>
    <rect x="116" y="85" width="4" height="31" rx="1"/>
    <!-- Dome Finial -->
    <circle cx="100" cy="73" r="2.5"/>
    <path d="M 98 75 L 102 75 L 100 70 Z"/>
    <!-- Sun Core Disc in Arch -->
    <circle cx="100" cy="94" r="6" fill="#FDE047"/>
    <!-- Base Step -->
    <rect x="76" y="116" width="48" height="3" rx="1" fill="#D97706"/>
  </g>
</svg>
