<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumni Directory - View Layer</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 960px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1e293b;
      background-color: #f8fafc;
      line-height: 1.5;
    }
    .container {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    h1 {
      color: #0f172a;
      margin-top: 0;
      margin-bottom: 6px;
      font-size: 1.85rem;
    }
    p.subtitle {
      color: #64748b;
      margin-top: 0;
      margin-bottom: 24px;
    }
    .alert-success {
      background: #dcfce7;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .alert-info {
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      color: #0369a1;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .alert-danger {
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-weight: 500;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      margin-bottom: 32px;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: middle;
    }
    th {
      background: #f1f5f9;
      color: #475569;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tr:hover {
      background: #f8fafc;
    }
    .actions-cell {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-sm {
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      transition: background 0.15s ease;
    }
    .btn-view {
      background: #e0f2fe;
      color: #0369a1;
    }
    .btn-view:hover {
      background: #bae6fd;
    }
    .btn-edit {
      background: #fef3c7;
      color: #92400e;
    }
    .btn-edit:hover {
      background: #fde68a;
    }
    .btn-delete {
      background: #fee2e2;
      color: #991b1b;
    }
    .btn-delete:hover {
      background: #fecaca;
    }
    .card-form {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 24px;
      margin-top: 24px;
    }
    .card-form h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #0f172a;
      margin-bottom: 16px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: #334155;
    }
    input {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      background: #ffffff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    button.btn-primary {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button.btn-primary:hover {
      background: #1d4ed8;
    }
    .nav-links {
      margin-top: 28px;
      display: flex;
      gap: 16px;
    }
    .nav-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">MVC Architecture &bull; Complete CRUD with View Layer</span>
    <h1>🎓 Alumni Directory</h1>
    <p class="subtitle">Full CRUD operations managed via <strong>UserController</strong> &amp; <strong>View Layer</strong></p>

    {{MESSAGE}}

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Department</th>
          <th>Graduation Year</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {{USER_ROWS}}
      </tbody>
    </table>

    <div class="card-form">
      <h2>➕ Add New Alumni</h2>
      <form action="/users" method="POST">
        <div class="form-grid">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Ahmet Yılmaz" required />
          </div>
          <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" name="department" placeholder="e.g. Computer Engineering" required />
          </div>
          <div class="form-group">
            <label for="graduationYear">Graduation Year</label>
            <input type="number" id="graduationYear" name="graduationYear" placeholder="e.g. 2024" required />
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="e.g. ahmet@alumni.edu" required />
          </div>
        </div>
        <button type="submit" class="btn-primary">Add Alumni</button>
      </form>
    </div>

    <div class="nav-links">
      <a href="/">← Return to Home</a>
      <a href="/apiuser">REST API (/apiuser)</a>
      <a href="/api/swagger">Swagger Documentation</a>
    </div>
  </div>
</body>
</html>
