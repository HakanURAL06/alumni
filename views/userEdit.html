<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit {{NAME}} - View Layer</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1e293b;
      background: #f8fafc;
      line-height: 1.5;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    h1 {
      margin-top: 0;
      color: #0f172a;
      font-size: 1.6rem;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: #64748b;
      margin-top: 0;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: #334155;
    }
    input {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      background: #ffffff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    button.btn-primary {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button.btn-primary:hover {
      background: #1d4ed8;
    }
    a.btn-secondary {
      background: #f1f5f9;
      color: #475569;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      transition: background 0.15s ease;
    }
    a.btn-secondary:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">MVC View Layer &bull; Edit Mode</span>
    <h1>✏️ Edit Alumni Profile</h1>
    <p class="subtitle">Update details for <strong>{{NAME}}</strong> (ID: {{ID}})</p>

    <form action="/users/{{ID}}/edit" method="POST">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" value="{{NAME}}" required />
      </div>

      <div class="form-group">
        <label for="department">Department</label>
        <input type="text" id="department" name="department" value="{{DEPARTMENT}}" required />
      </div>

      <div class="form-group">
        <label for="graduationYear">Graduation Year</label>
        <input type="number" id="graduationYear" name="graduationYear" value="{{GRADUATION_YEAR}}" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" value="{{EMAIL}}" required />
      </div>

      <div class="button-group">
        <button type="submit" class="btn-primary">💾 Save Changes</button>
        <a href="/users/{{ID}}" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
