<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} - Announcement Detail</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 0 20px;
      color: #1e293b;
      background: #f8fafc;
      line-height: 1.6;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #e0e7ff;
      color: #3730a3;
      margin-bottom: 12px;
    }
    h1 {
      margin-top: 0;
      color: #0f172a;
      font-size: 1.7rem;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .meta {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }
    .content-box {
      background: #f8fafc;
      border-radius: 8px;
      padding: 20px;
      font-size: 1.05rem;
      color: #334155;
      margin-bottom: 24px;
      white-space: pre-wrap;
    }
    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 9px 18px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      transition: background 0.15s ease;
    }
    .btn-edit { background: #fef3c7; color: #92400e; }
    .btn-edit:hover { background: #fde68a; }
    .btn-delete { background: #fee2e2; color: #991b1b; }
    .btn-delete:hover { background: #fecaca; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
    .btn-secondary:hover { background: #e2e8f0; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">{{CATEGORY}}</span>
    <h1>📢 {{TITLE}}</h1>
    <div class="meta">
      Published by <strong>{{AUTHOR}}</strong> on <span>{{DATE}}</span> (ID: #{{ID}})
    </div>

    <div class="content-box">
      {{CONTENT}}
    </div>

    <div class="actions">
      <a href="/announcements/{{ID}}/edit" class="btn btn-edit">✏️ Edit Announcement</a>
      <form action="/announcements/{{ID}}/delete" method="POST" style="display:inline;" onsubmit="return confirm('Delete this announcement?');">
        <button type="submit" class="btn btn-delete">🗑️ Delete Announcement</button>
      </form>
      <a href="/announcements" class="btn btn-secondary">← Back to Announcements</a>
    </div>
  </div>
</body>
</html>
